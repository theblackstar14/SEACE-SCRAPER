# Proxy de salida peruano. Va en el NAS (Synology Container Manager), NO en
# el VPS: SEACE 403ea toda IP que no sea de Perú y el VPS está en EE.UU.
#
# Sube a /volume1/docker/tinyproxy/tinyproxy.conf
# El contenedor publica el 8888 SOLO en la IP Tailscale del NAS.

Port 8888
# 0.0.0.0 y no la IP de Tailscale: bindearla da "Could not create listening
# sockets" (no existe todavía cuando arranca el contenedor). Quien filtra es
# el `Allow` de abajo, que en network_mode: host ve el source IP real.
Listen 0.0.0.0

# 600s: un PDF de 50 MB por la subida de una conexión hogareña tarda.
# Coincide con el timeoutMs de descargaHttp.js.
Timeout 600
MaxClients 20

# 127.0.0.1 y no el rango de Tailscale: el paquete de Synology corre en
# userspace-networking, o sea que no hay interfaz tailscale0 — tailscaled
# reenvía lo que viene del tailnet a loopback y el source IP llega como
# 127.0.0.1 (medido: `Unauthorized connection from "127.0.0.1"`).
#
# No afloja nada: un equipo de la LAN que pegue al 8888 llega con su IP de
# LAN y lo rechaza igual. Lo único que entra por loopback es el tailnet.
# El /10 queda por si algún día el paquete pasa a modo tun.
Allow 127.0.0.1
Allow 100.64.0.0/10

# SIN esto tinyproxy rechaza el CONNECT y TODO HTTPS falla. No es opcional.
ConnectPort 443

# Subir a Info para depurar el ACL: loguea el source IP de cada rechazo.
LogLevel Warning
